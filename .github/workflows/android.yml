name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK (arm64 phones)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a 2>&1 | tee ../gradle.log

      - name: Surface build errors
        if: failure()
        run: |
          # Put the key error lines into an annotation so they show on the run summary.
          if [ -f gradle.log ]; then
            grep -E "error:|e: |FAILURE|What went wrong|Could not|> " gradle.log | grep -v "^> Task" | head -60 > errs.txt || true
            [ -s errs.txt ] || tail -60 gradle.log > errs.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errs.txt)
            echo "::error title=Gradle build failed::${msg}"
          fi

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/reamp-next-build-${{ github.run_number }}.apk"

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Test build from commit ${{ github.sha }}.
            On your phone: tap the .apk below to download, then open it to install.
          files: dist/*.apk
          make_latest: true
